# 시민에너지신문 사이트 배포 (2026-11-10)
# GitHub 기본 배포(10분 제한)가 마무리 단계에서 자꾸 시간 초과 → 직접 배포로 바꿈
# - 제한 시간 30분, 실패하면 한 번 더 시도
# - 새 글이 연달아 올라오면 이전 배포는 취소하고 최신 것만 올림
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 1800000
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
